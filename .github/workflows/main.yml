name: Flutter iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS IPA (Unsigned)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Runner.ipa Payload
        
      - name: Upload Unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: build/ios/iphoneos/Runner.ipa

      - name: Attempt Signed Build (Optional)
        continue-on-error: true
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > certificate.p12
            security import certificate.p12 -k ~/Library/Keychains/login.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign || true
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          fi

      - name: Upload Signed IPA artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Signed-IPA
          path: build/ios/ipa/*.ipa
